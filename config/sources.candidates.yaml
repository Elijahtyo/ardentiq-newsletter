# Candidate sources for Phase 0 audit.
#
# Each entry lists one or more candidate feed URLs, best guess first. The audit
# job (python -m ai_news.jobs.audit_sources) tries them in order, records HTTP
# status, robots.txt permission, feed type and item counts, and promotes the
# first URL that parses into config/sources.yaml.
#
# Nothing here is assumed good. Entries that fail every candidate are written to
# sources.yaml with active: false and the reason in notes.
#
# content_policy: full | excerpt_only | headline_only
version: 1

