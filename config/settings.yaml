# Non-secret configuration. Secrets are referenced as ${ENV_VAR} and supplied by
# GitHub Actions secrets at run time. Never put a token in this file.

# No database. The digest is emailed to the client list; run state is kept in
# the repository under state/. Recipients are a secret, never a config value.
briefing:
  send_enabled: false
  subject_prefix: "AI briefing for UK SMEs"
  footer: >-
    You are receiving this briefing because you asked to be kept informed.
    Reply to this email to change your preferences or to be removed.
  out_dir: briefing/out
  recipients_env: BRIEFING_RECIPIENTS
  test_recipients_env: BRIEFING_TEST_TO
  sender_name: "AI news briefing"

state:
  state_file: state/pipeline_state.json
  runs_file: state/runs.jsonl
  first_run_lookback_days: 3

# Model ids live here, not in code. Change a model without touching Python.
models:
  filtering: claude-haiku-5-5
  summarising: claude-sonnet-5-5
  digest: claude-sonnet-5-5
  drafting: claude-sonnet-5-5
  rubric: claude-haiku-5-5

schedule:
  timezone: Europe/London
  target_hour: 9
  target_minute: 0
  guard_window_minutes: 60
  run_days: [mon, thu]

pipeline:
  digest_min_items: 10
  digest_max_items: 12
  near_duplicate_threshold: 0.82
  max_sectors_per_item: 2

linkedin:
  publishing_enabled: false
  organisation_urn: ${LINKEDIN_ORG_URN:-}
  api_version: "202411"
  drafts_per_digest: 3
  hashtags_max: 3
  # Drafts and their approval state live in the repository.
  drafts_dir: linkedin/drafts
  published_file: linkedin/published.jsonl

http:
  timeout_seconds: 30
  max_retries: 3
  user_agent: "ai-news-pipeline/0.1"

sources_file: config/sources.yaml
