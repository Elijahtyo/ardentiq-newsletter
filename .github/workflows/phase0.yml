name: phase0
# Phase 0 gate checks, run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_MAILBOX: ${{ secrets.MS_MAILBOX }}
      MS_POLICY_PROBE_MAILBOX: ${{ vars.MS_POLICY_PROBE_MAILBOX }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      BRIEFING_RECIPIENTS: ${{ secrets.BRIEFING_RECIPIENTS }}
      BRIEFING_TEST_TO: ${{ secrets.BRIEFING_TEST_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint and test
        run: |
          ruff check .
          pytest
      - name: Secrets present and working
        run: python -m ai_news.jobs.check_secrets --live
      - name: Briefing renders
        run: python -m ai_news.jobs.briefing_smoke --dry-run
